<!DOCTYPE html>
<html lang="en" data-site-root="$site_root$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ — rules_hs Documentation</title>
  <meta name="description" content="$description$">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("rules_hs_theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/syntax.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <button type="button" id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="Toggle navigation sidebar" aria-expanded="false" aria-controls="docs-sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a class="brand" href="$brand_href$">
          <span class="brand-logo" aria-hidden="true">&lambda;</span>
          <span class="brand-name">rules_hs</span>
          <span class="brand-badge">Bazel 9 &middot; Bzlmod</span>
        </a>
      </div>

      <div class="header-center">
        <button type="button" id="search-open-btn" class="search-trigger" aria-label="Search documentation">
          <svg class="search-trigger-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="search-trigger-text">Search documentation&hellip;</span>
          <span class="search-trigger-kbd"><kbd>/</kbd> <kbd>&#8984;K</kbd></span>
        </button>
      </div>

      <div class="header-right">
        <button type="button" id="theme-toggle-btn" class="icon-btn" aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a class="header-ext-link" href="https://github.com/kaycebasques/hs" target="_blank" rel="noopener noreferrer" aria-label="GitHub repository">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.92.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.02 11.02 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.26 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <div class="docs-shell $layout_class$">
    <aside id="docs-sidebar" class="docs-sidebar" aria-label="Documentation navigation">
      <div class="sidebar-scroll">
        $sidebar_nav$
      </div>
    </aside>

    <main id="main-content" class="docs-main" tabindex="-1">
      <div class="main-container">
        $breadcrumbs$
        <article class="docs-prose">
          <header class="page-header">
            <h1 id="page-top" class="page-title">$title$</h1>
            <p class="page-description">$description$</p>
          </header>
          <div class="prose-body">
            $body$
          </div>
        </article>
        $prev_next$
        <footer class="site-footer">
          <span>Built hermetically on Bazel 9 with <code>rules_hs</code>, Hakyll, Pandoc &amp; Skylighting.</span>
        </footer>
      </div>
    </main>

    <aside class="docs-toc" aria-label="On this page">
      $toc_html$
    </aside>
  </div>

  <div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-label" hidden>
    <div class="search-modal-backdrop" data-close-search="true"></div>
    <div class="search-modal-panel">
      <div class="search-input-row">
        <label id="search-modal-label" for="search-input" class="sr-only">Search documentation</label>
        <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="search" placeholder="Search rules, providers, guides, flags, internals&hellip;" autocomplete="off" spellcheck="false">
        <button type="button" id="search-close-btn" class="search-esc-btn" aria-label="Close search">ESC</button>
      </div>
      <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
      <div class="search-footer">
        <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> Navigate</span>
        <span><kbd>&crarr;</kbd> Open</span>
        <span><kbd>ESC</kbd> Close</span>
      </div>
    </div>
  </div>

  <script src="/static/docs.js" defer></script>
</body>
</html>
